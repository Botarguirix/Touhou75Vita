name: Touhou75Vita Vita Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-vita:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show VitaSDK
        run: |
          echo "VITASDK=$VITASDK"
          arm-vita-eabi-gcc --version
          command -v vita-make-fself
          command -v vita-mksfoex
          command -v vita-pack-vpk

      - name: Build
        working-directory: vita
        run: make

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: Touhou75Vita-iteration06-vpk
          path: vita/build/*.vpk
          if-no-files-found: error
